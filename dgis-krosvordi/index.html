  <!-- Hand-made page (tools/build_share.js does not touch it). The script below picks today's

  <div id="crossword">
    <main>
      <a class="back" href="../ka/crosswords/">← ყველა კროსვორდი</a>
      <h1>დღის <em>კროსვორდი</em></h1>
      <p class="intro" id="dailyMsg">ახალი საფეხბურთო კროსვორდი ყოველდღე, ყველა თემიდან. ორშაბათს მარტივია, კვირას ყველაზე რთული.</p>
    </main>
  </div>
  <script>
  (function () {
    var d = new Date();
    var iso = d.toLocaleDateString("en-CA"); // today in the player's own time, YYYY-MM-DD
    var MONTHS = ["იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი", "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"];
    var LEVEL = { "Easy": "მარტივი", "Medium": "საშუალო", "Hard": "რთული", "Very hard": "ძალიან რთული" };
    function missing() {
      document.getElementById("dailyMsg").textContent = "დღევანდელი კროსვორდი ჯერ არ არის მზად. მოგვიანებით შემოიარე ან აირჩიე სხვა კროსვორდი სიიდან.";
    }
    var s = document.createElement("script");
    s.src = iso.slice(0, 7) + ".js";
    s.onerror = missing;
    s.onload = function () {
      var p = (window.DAILY || {})[iso];
      if (!p) return missing();
      var day = "დღის კროსვორდი. " + d.getDate() + " " + MONTHS[d.getMonth()];
      var level = LEVEL[p.level] || p.level;
      window.PUZZLE = {
        id: "ka-daily-" + iso,
        lang: "ka",
        title: "დღის <em>კროსვორდი</em>",
        intro: day + " · სირთულე: " + level.toLowerCase() + ". კროსვორდის კითხვები ყოველდღე იცვლება და რთულდება. ორშაბათს მარტივია, კვირას ყველაზე რთული.",
        rows: p.rows, cols: p.cols, words: p.words,
        shareName: "დღის კროსვორდი · " + d.getDate() + " " + MONTHS[d.getMonth()],
        invite: "⚽ შეძლებ დღევანდელი საფეხბურთო კროსვორდის ამოხსნას? " + p.words.length + " პასუხი, სირთულე: " + level + ".",
      };
      var g = document.createElement("script");
      g.src = "../crossword.js?v=23";
      document.body.appendChild(g);
    };
    document.body.appendChild(s);
  })();
  </script>

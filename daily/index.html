<body>
  <!-- Hand-made page (tools/build_share.js does not touch it). The script below picks today's
       crossword from daily/YYYY-MM.js (made by tools/build_daily.py) and starts the game. -->
  <div id="crossword">
    <main>
      <a class="back" href="../">← All crosswords</a>
      <h1>Daily <em>Crossword</em></h1>
      <p class="intro" id="dailyMsg">A new football crossword every day, mixed from every topic: World Cups, the Champions League, clubs and legends. Easy on Monday, hardest on Sunday.</p>
    </main>
  </div>
  <script>
  (function () {
    var d = new Date();
    var iso = d.toLocaleDateString("en-CA"); // today in the player's own time, YYYY-MM-DD
    var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    function missing() {
      document.getElementById("dailyMsg").textContent = "Today's crossword isn't ready yet. Please come back soon, or pick one from the full list.";
    }
    var s = document.createElement("script");
    s.src = iso.slice(0, 7) + ".js";
    s.onerror = missing;
    s.onload = function () {
      var p = (window.DAILY || {})[iso];
      if (!p) return missing();
      var day = DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
      window.PUZZLE = {
        id: "daily-" + iso,
        title: "Daily <em>Crossword</em>",
        intro: day + " · " + p.level + ". A new mix of clues from every topic, every day: easy on Monday, hardest on Sunday. Tap a square to start; tap it again to switch between across and down.",
        note: "Unofficial fan game. Each clue starts with the crossword it comes from. A new crossword every day at midnight, your time. Names are written without accents or spaces.",
        rows: p.rows, cols: p.cols, words: p.words,
        shareName: "Daily Football Crossword · " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3) + " " + d.getFullYear(),
        invite: "⚽ Can you solve today's football crossword? " + p.words.length + " answers, " + p.level.toLowerCase() + ".",
      };
      var g = document.createElement("script");
      g.src = "../crossword.js";
      document.body.appendChild(g);
    };
    document.body.appendChild(s);
  })();
  </script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Football Crosswords</title>
  <meta name="description" content="Free football crosswords. Pick a topic and play.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="crossword.css">
</head>
<body>
  <main class="narrow">
    <h1>Football <em>Crosswords</em></h1>
    <p class="intro">Free football crosswords. Pick a topic and play. Your progress is saved on your device.</p>

    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Difficulty</span>
        <div class="chips" id="filter-difficulty"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Topic</span>
        <div class="chips" id="filter-topic"></div>
      </div>
    </div>

    <p class="shown" id="shown"></p>
    <!-- The cards are drawn by home.js from the list in crosswords.js -->
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>No crosswords match these filters yet. Try another difficulty or topic.</p>
  </main>
  <script src="crosswords.js"></script>
  <script src="home.js"></script>
</body>
</html>
